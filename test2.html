<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hello好酪 | 線上預訂系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-bg: #FDFBF8;
            --c-surface: #FFFFFF;
            --c-primary: #8C7B75;
            --c-primary-light: #BCAAA4;
            --c-accent: #AFA88B;
            --c-text: #594A42;
            --c-text-light: #9E9E9E;
            --c-line: #EFEBE9;
            --c-danger: #D87C7C;
            --c-success: #78909C;
            --radius-box: 16px;
            --shadow-card: 0 4px 15px rgba(140, 123, 117, 0.08);
            --shadow-float: 0 10px 30px rgba(140, 123, 117, 0.22);
            --font-title: 'Noto Serif TC', serif;
            --font-body: 'Noto Sans TC', sans-serif;
            --max-w: 520px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #F2EFE9;
            color: var(--c-text);
            font-family: var(--font-body);
            min-height: 100vh;
            line-height: 1.6;
        }

        #app {
            width: 100%;
            max-width: var(--max-w);
            background-color: var(--c-bg);
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            padding-bottom: 230px; /* 預留底部雙層懸浮島的高度 */
            box-shadow: 0 0 40px rgba(0,0,0,0.06);
        }

        /* 頂部 Header */
        header {
            background: rgba(253, 251, 248, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            border-bottom: 1px solid var(--c-line);
        }
        .header-logo { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        header span { font-family: var(--font-title); font-size: 1.2rem; color: var(--c-text); font-weight: 700; letter-spacing: 1px; }

        .container { padding: 0 16px; }

        /* 店員動態對話框 */
        .clerk-banner {
            margin: 16px 0;
            background: #FAF8F5;
            border: 1px solid var(--c-primary-light);
            border-radius: var(--radius-box);
            padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: var(--shadow-card);
        }
        .clerk-avatar {
            width: 42px; height: 42px; border-radius: 50%; background: var(--c-primary);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0; border: 2px solid #fff;
        }
        .clerk-speech { font-size: 0.88rem; color: var(--c-text); font-weight: 500; line-height: 1.45; }

        /* 取件 Tab 切換 */
        .fulfillment-selector { display: flex; background: #EFEBE9; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; font-size: 0.9rem; font-weight: bold; color: var(--c-text-light); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: white; color: var(--c-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        /* 菜單展示 Grid (含圖片) */
        .section-title { font-family: var(--font-title); font-size: 1.15rem; font-weight: 700; text-align: center; margin: 25px 0 15px; color: var(--c-text); letter-spacing: 1px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .menu-card {
            background: #fff; border-radius: var(--radius-box); padding: 12px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border: 1px solid var(--c-line); box-shadow: var(--shadow-card); position: relative;
        }
        .card-img-wrapper { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #f4f4f4; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .menu-card:hover .card-img { transform: scale(1.06); }
        .card-badge { position: absolute; top: 18px; left: 18px; font-size: 0.7rem; background: var(--c-danger); color: white; padding: 2px 8px; border-radius: 12px; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .card-title { font-family: var(--font-title); font-size: 0.95rem; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
        .card-desc { font-size: 0.75rem; color: #888; margin-bottom: 6px; line-height: 1.4; height: 2.8em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-ingredients { font-size: 0.7rem; color: #8D6E63; background: #F8F6F4; padding: 6px; border-radius: 6px; margin-bottom: 10px; width: 100%; line-height: 1.3; text-align: justify; }
        .card-price { font-family: var(--font-title); font-size: 1.1rem; font-weight: 700; color: var(--c-primary); margin-bottom: 10px; margin-top: auto; }

        /* 數量按鈕 */
        .add-btn { background: transparent; border: 1px solid var(--c-primary); color: var(--c-primary); padding: 7px 0; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 500; width: 100%; transition: all 0.2s; }
        .add-btn:active { background: var(--c-primary); color: #fff; }
        .qty-controller { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #fff; border: 1px solid var(--c-primary); border-radius: 6px; padding: 3px 6px; }
        .btn-qty { border: none; background: transparent; font-size: 1.1rem; color: var(--c-primary); font-weight: bold; cursor: pointer; width: 26px; height: 26px; }
        .qty-num { font-family: var(--font-title); font-weight: bold; font-size: 0.95rem; }

        /* 表單卡片 */
        .form-card { background: white; border-radius: var(--radius-box); padding: 18px; border: 1px solid var(--c-line); margin-top: 25px; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.85rem; font-weight: 700; color: var(--c-text); margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 12px; font-size: 0.95rem; border: 1px solid #E0E0E0; border-radius: 8px; outline: none; background: #FCFCFC; }
        .form-input:focus { border-color: var(--c-accent); background: white; }

        /* 🌟 下方雙層懸浮島 (Floating Dock with Box Visualizer) */
        .bottom-floating-island {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 490px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; padding: 12px 16px;
            box-shadow: var(--shadow-float); border: 1px solid rgba(255, 255, 255, 0.9); z-index: 999;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* 懸浮島上層：6 孔視覺化托盤 */
        .dock-box-tray {
            background: #FAF8F5; border: 1px dashed var(--c-primary-light);
            border-radius: 16px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
        }
        .tray-status-text { font-size: 0.78rem; font-weight: 700; color: var(--c-primary); }
        .dock-slots-grid { display: flex; gap: 6px; }
        .dock-slot {
            width: 28px; height: 28px; border-radius: 50%; background: #EFEBE9;
            border: 1px solid #E0DCD9; display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; color: #999; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dock-slot.filled {
            background: var(--c-primary); color: white; border-color: var(--c-primary);
            transform: scale(1.1); box-shadow: 0 2px 6px rgba(140, 123, 117, 0.3);
        }

        /* 懸浮島下層：金額與結帳按鈕 */
        .dock-checkout-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 2px; }
        .price-info { display: flex; flex-direction: column; }
        .price-subtag { font-size: 0.75rem; color: #888; display: flex; align-items: center; gap: 4px; }
        .total-price { font-family: var(--font-title); font-size: 1.3rem; font-weight: 700; color: var(--c-text); }
        .btn-checkout { background: var(--c-primary); color: white; border: none; padding: 10px 22px; border-radius: 50px; font-size: 0.9rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(140, 123, 117, 0.3); transition: transform 0.2s; }
        .btn-checkout:active { transform: scale(0.96); }

        /* 小白單 Modal */
        #receipt-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .receipt-card {
            background: white; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; font-family: monospace;
        }
        .receipt-title { font-family: var(--font-title); font-size: 1.25rem; font-weight: 700; text-align: center; color: var(--c-text); }
        .receipt-divider { border-bottom: 1px dashed #ccc; margin: 12px 0; }
        .receipt-row { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; }
        .btn-close-receipt { background: var(--c-primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 50px; font-weight: bold; font-size: 0.95rem; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Sticky 頂部標頭 -->
        <header>
            <img src="logo.jpg" alt="Logo" class="header-logo" onerror="this.style.display='none'">
            <span>hello好酪</span>
        </header>

        <div class="container">
            <!-- 店員動態對話框 -->
            <div class="clerk-banner">
                <div class="clerk-avatar">👩🏻‍🍳</div>
                <div class="clerk-speech" id="clerk-dialog">歡迎光臨！今天想預訂什麼口味的手作鮮奶酪呢？</div>
            </div>

            <!-- 取件方式 Tab 切換 -->
            <div class="fulfillment-selector">
                <button class="tab-btn active" onclick="setFulfillment('pickup')">📍 門市自取</button>
                <button class="tab-btn" onclick="setFulfillment('delivery')">🚚 冷藏宅配</button>
            </div>

            <!-- 菜單區域 (完整圖片與資訊) -->
            <div class="section-title">— 手作甜點菜單 —</div>
            <div class="menu-grid" id="menu-grid">
                <!-- JS 動態繪製菜單卡片 -->
            </div>

            <!-- 訂購人資料 -->
            <div class="section-title">— 訂購人資訊 —</div>
            <div class="form-card">
                <div class="form-group">
                    <label class="form-label">訂購人姓名 *</label>
                    <input type="text" id="cust-name" class="form-input" placeholder="您的稱呼">
                </div>
                <div class="form-group">
                    <label class="form-label">手機號碼 *</label>
                    <input type="tel" id="cust-phone" class="form-input" placeholder="09xx-xxx-xxx" maxlength="10">
                </div>
                <div class="form-group" id="address-group" style="display:none;">
                    <label class="form-label">宅配地址 *</label>
                    <input type="text" id="cust-addr" class="form-input" placeholder="請輸入詳細宅配地址">
                </div>
            </div>
        </div>

        <!-- 🌟 下方雙層懸浮島 (包含 6 孔裝盒托盤與結帳欄) -->
        <div class="bottom-floating-island">
            <!-- 上層：6 孔禮盒動態托盤 -->
            <div class="dock-box-tray">
                <div class="tray-status-text" id="box-status-text">禮盒裝配：0/6 杯</div>
                <div class="dock-slots-grid" id="dock-slots-grid">
                    <div class="dock-slot">1</div>
                    <div class="dock-slot">2</div>
                    <div class="dock-slot">3</div>
                    <div class="dock-slot">4</div>
                    <div class="dock-slot">5</div>
                    <div class="dock-slot">6</div>
                </div>
            </div>

            <!-- 下層：合計金額與結帳按鈕 -->
            <div class="dock-checkout-bar">
                <div class="price-info">
                    <div class="price-subtag">
                        🛒 共 <span id="total-cups" style="font-weight:bold; color:var(--c-text);">0</span> 杯 | 
                        <span id="shipping-tag" style="color:var(--c-primary);">自取$0</span>
                    </div>
                    <div class="total-price">NT$ <span id="final-total">0</span></div>
                </div>
                <button class="btn-checkout" onclick="openReceipt()">確認預訂</button>
            </div>
        </div>
    </div>

    <!-- 櫃檯點餐小白單 Modal -->
    <div id="receipt-modal">
        <div class="receipt-card">
            <div class="receipt-title">hello好酪 門市預訂單</div>
            <div style="font-size:0.75rem; text-align:center; color:#888; margin-top:4px;" id="receipt-time"></div>
            <div class="receipt-divider"></div>

            <div id="receipt-items-list"></div>

            <div class="receipt-divider"></div>
            <div class="receipt-row"><span>商品合計</span><span id="r-subtotal">$0</span></div>
            <div class="receipt-row"><span>運費小計</span><span id="r-shipping">$0</span></div>
            <div class="receipt-row" style="font-weight:bold; font-size:1rem;"><span>應付總額</span><span id="r-total" style="color:var(--c-danger);">$0</span></div>
            <div class="receipt-divider"></div>

            <div class="receipt-row"><span>訂購人</span><span id="r-name">-</span></div>
            <div class="receipt-row"><span>取件方式</span><span id="r-fulfillment">門市自取</span></div>

            <button class="btn-close-receipt" onclick="copyReceiptAndClose()">📋 複製預訂資訊並關閉</button>
        </div>
    </div>

    <script>
        // 完整的 12 項菜單資料 (還原原圖片與成份)
        const products = [
            { id: 1, name: "經典原味鮮奶酪", price: 50, image: "230242.jpg", desc: "濃郁奶香、綿密滑順，熱賣必買的人氣口味。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、日本製上白糖、德國吉利丁", badge: "銷售第一" },
            { id: 2, name: "巧克力鮮奶酪", price: 55, image: "230240_0.jpg", desc: "選用法芙娜可可，可可香濃郁，大人小孩都愛。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、法芙娜可可粉", badge: "銷售第二" },
            { id: 7, name: "伯爵紅茶鮮奶酪", price: 55, image: "230241_0.jpg", desc: "大人系口味，佛手柑清香，茶香與奶香圓潤融合。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、皇家伯爵紅茶", badge: "銷售第三" },
            { id: 10, name: "十薰茉綠鮮奶酪", price: 55, image: "230243.jpg", desc: "茉莉花香與綠茶柔和交織，淡雅茶韻。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、彰化十薰茉莉綠" },
            { id: 3, name: "芝麻鮮奶酪", price: 55, image: "230239_0.jpg", desc: "嚴選 100% 黑芝麻研磨，芝麻香氣濃厚。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、台灣薌園黑芝麻" },
            { id: 4, name: "抹茶鮮奶酪", price: 55, image: "230234_0.jpg", desc: "抹茶香氣醇厚，微苦甜平衡，綿密不膩。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、靜岡原產抹茶粉" },
            { id: 6, name: "泰式奶茶鮮奶酪", price: 55, image: "230235_0.jpg", desc: "手標泰式紅茶先炒出茶香，泰奶香氣濃郁。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、泰國紅標紅茶" },
            { id: 8, name: "芋香紫薯鮮奶酪", price: 55, image: "230237_0.jpg", desc: "細火熬煮，口感細綿，淡淡芋香與自然紫薯色。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、芋頭&紫心甘薯" },
            { id: 9, name: "微醺蘭姆鮮奶酪", price: 55, image: "230233_0.jpg", desc: "成年人的微醺快樂，奶香中帶醉人餘韻。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、菲律賓蘭姆酒RUM" },
            { id: 5, name: "咖啡鮮奶酪", price: 55, image: "230236_0.jpg", desc: "嚴選阿拉比卡咖啡豆，咖啡與奶香完美融合。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、上白糖、吉利丁、日本NestleGold" },
            { id: 14, name: "烤布丁", price: 55, image: "12356211.jpg", desc: "滑嫩香濃，焦糖微苦，口感綿密。", ingredients: "成份 | 100%純鮮奶、法國鮮奶油、新鮮雞蛋、天然香草籽醬" },
            { id: 13, name: "質感保冷袋", price: 15, image: "155911.png", desc: "長途保鮮推薦加購，讓奶酪維持最佳口感。", ingredients: "材質 | 環保鋁箔保溫層、不織布提把" }
        ];

        let cart = {}; // { id: qty }
        let fulfillment = 'pickup'; // 'pickup' | 'delivery'

        function init() {
            renderMenu();
            updateApp();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = products.map(p => {
                const qty = cart[p.id] || 0;
                const btnHtml = qty > 0 
                    ? `<div class="qty-controller"><button class="btn-qty" onclick="changeQty(${p.id}, -1)">-</button><span class="qty-num">${qty}</span><button class="btn-qty" onclick="changeQty(${p.id}, 1)">+</button></div>`
                    : `<button class="add-btn" onclick="changeQty(${p.id}, 1)">加入購物車</button>`;

                return `
                    <div class="menu-card">
                        <div class="card-img-wrapper">
                            <img src="${p.image}" alt="${p.name}" class="card-img" onerror="this.src='https://via.placeholder.com/300x300?text=hello%E5%A5%BD%E9%85%AA'">
                        </div>
                        ${p.badge ? `<div class="card-badge">${p.badge}</div>` : ''}
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-ingredients">${p.ingredients}</div>
                        <div class="card-price">$${p.price}</div>
                        ${btnHtml}
                    </div>
                `;
            }).join('');
        }

        function changeQty(id, delta) {
            const current = cart[id] || 0;
            const updated = current + delta;
            if (updated > 0) cart[id] = updated;
            else delete cart[id];
            
            renderMenu();
            updateApp();
        }

        function setFulfillment(mode) {
            fulfillment = mode;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (mode === 'pickup' && idx === 0) || (mode === 'delivery' && idx === 1));
            });
            document.getElementById('address-group').style.display = mode === 'delivery' ? 'block' : 'none';
            updateApp();
        }

        function updateApp() {
            let totalCups = 0;
            let productSubtotal = 0;

            for (let id in cart) {
                let p = products.find(x => x.id == id);
                if (p) {
                    productSubtotal += p.price * cart[id];
                    if (id != 13) totalCups += cart[id]; // 保冷袋不列入奶酪杯數
                }
            }

            // 1. 運費計算 (滿 900 免運)
            let shippingFee = 0;
            if (fulfillment === 'delivery') {
                if (productSubtotal >= 900 || totalCups === 0) shippingFee = 0;
                else {
                    let boxes = Math.ceil(totalCups / 6);
                    shippingFee = boxes <= 2 ? 130 : (boxes <= 8 ? 170 : 210);
                }
            }

            let grandTotal = productSubtotal + shippingFee;

            // 2. 更新下方懸浮島數據
            document.getElementById('total-cups').innerText = totalCups;
            document.getElementById('final-total').innerText = grandTotal.toLocaleString();
            document.getElementById('shipping-tag').innerText = fulfillment === 'pickup' ? '自取$0' : (shippingFee === 0 ? '免運費' : `運費$${shippingFee}`);

            // 3. 🌟 更新下方懸浮島 6 孔禮盒托盤
            const currentSlots = totalCups % 6;
            const fullBoxes = Math.floor(totalCups / 6);
            
            const boxStatusText = document.getElementById('box-status-text');
            if (totalCups > 0 && currentSlots === 0) {
                boxStatusText.innerText = `禮盒裝配：已滿 ${fullBoxes} 盒 (6/6)`;
            } else {
                boxStatusText.innerText = `禮盒裝配：${fullBoxes > 0 ? `已裝 ${fullBoxes} 盒 / ` : ''}剩 ${currentSlots}/6 杯`;
            }

            const dockSlotsGrid = document.getElementById('dock-slots-grid');
            let slotsHtml = '';
            for(let i = 0; i < 6; i++) {
                if (i < currentSlots || (totalCups > 0 && currentSlots === 0)) {
                    slotsHtml += `<div class="dock-slot filled">✓</div>`;
                } else {
                    slotsHtml += `<div class="dock-slot">${i + 1}</div>`;
                }
            }
            dockSlotsGrid.innerHTML = slotsHtml;

            // 4. 更新店員對話框 (Clerk Dialog Prompt)
            const dialog = document.getElementById('clerk-dialog');
            if (totalCups === 0) {
                dialog.innerText = "歡迎光臨！今天想預訂什麼口味的手作鮮奶酪呢？";
            } else if (fulfillment === 'delivery' && totalCups % 6 !== 0) {
                dialog.innerText = `宅配溫馨提醒：冷藏宅配以 6 杯為一整盒出貨，目前共有 ${totalCups} 杯，再選 ${6 - (totalCups % 6)} 杯就能完美包裝囉！`;
            } else if (totalCups % 6 !== 0) {
                dialog.innerText = `好選擇！再挑選 ${6 - (totalCups % 6)} 杯，就能湊滿一整盒免費獲得質感禮盒包裝喔！`;
            } else if (productSubtotal < 900 && fulfillment === 'delivery') {
                dialog.innerText = `目前已滿 ${fullBoxes} 盒！商品再滿 $${900 - productSubtotal} 元即可享冷藏宅配免運費！`;
            } else {
                dialog.innerText = `太棒的口味組合！系統已為您算好最佳優惠，請點選下方按鈕確認預訂喔 🥰`;
            }
        }

        function openReceipt() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();

            if (!name || !phone) {
                alert("請填寫訂購人姓名與手機號碼！");
                return;
            }

            let totalCups = 0;
            let productSubtotal = 0;
            let itemsHtml = '';

            for (let id in cart) {
                let p = products.find(x => x.id == id);
                if (p) {
                    let cost = p.price * cart[id];
                    productSubtotal += cost;
                    if (id != 13) totalCups += cart[id];
                    itemsHtml += `<div class="receipt-row"><span>${p.name} x ${cart[id]}</span><span>$${cost}</span></div>`;
                }
            }

            if (productSubtotal === 0) {
                alert("購物車內尚未加入商品喔！");
                return;
            }

            let shippingFee = (fulfillment === 'delivery' && productSubtotal < 900) ? 130 : 0;
            let grandTotal = productSubtotal + shippingFee;

            document.getElementById('receipt-items-list').innerHTML = itemsHtml;
            document.getElementById('r-subtotal').innerText = `$${productSubtotal}`;
            document.getElementById('r-shipping').innerText = `$${shippingFee}`;
            document.getElementById('r-total').innerText = `$${grandTotal}`;
            document.getElementById('r-name').innerText = `${name} (${phone})`;
            document.getElementById('r-fulfillment').innerText = fulfillment === 'pickup' ? '門市自取' : '冷藏宅配';
            document.getElementById('receipt-time').innerText = "點單時間：" + new Date().toLocaleString('zh-TW', {hour12: false});

            document.getElementById('receipt-modal').style.display = 'flex';
        }

        function copyReceiptAndClose() {
            alert("預訂資訊已成功複製到剪貼簿！您可以直接貼上傳給官方 LINE 客服人員。");
            document.getElementById('receipt-modal').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
